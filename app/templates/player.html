<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/brand/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/static/css/app.css">
<script defer src="/static/js/player.js?v=3"></script>
<style>
  .player-startup { display: grid; place-items: center; min-height: calc(100vh - 140px); }
  .player-startup .card { width: min(380px, 100%); padding: 26px 20px; box-shadow: var(--shadow); }
  .player-startup h1 { font-size: 19px; }
  .player-spinner { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid var(--border2);
                    border-top-color: var(--acc); border-radius: 50%; }
  @media (prefers-reduced-motion: no-preference) { .player-spinner { animation: player-spin .8s linear infinite; } }
  @keyframes player-spin { to { transform: rotate(1turn); } }
  .player-layout { display: grid; grid-template: "video playlist" auto "tools playlist" 1fr / minmax(0, 1fr) 340px;
                   gap: 12px 16px; align-items: start; }
  .player-startup[hidden], .player-layout[hidden] { display: none; }
  .video-frame { grid-area: video; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  .video-idle { display: grid; place-items: center; aspect-ratio: 16/9; padding: 16px; }
  .video-idle .btn { min-height: 44px; padding-inline: 20px; font-size: 15px; }
  .video-frame .video-js { width: 100%; aspect-ratio: 16/9; }
  .player-tools { grid-area: tools; }
  .now { display: flex; gap: 12px; align-items: flex-start; }
  .now img { width: 74px; height: 48px; object-fit: cover; border-radius: 7px; background: var(--panel); }
  .now h2 { font-size: 17px; margin: 0 0 3px; overflow-wrap: anywhere; }
  #btn-download[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .jump { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .jump input[type=text] { width: 118px; font-family: ui-monospace, monospace; }
  .side-panel { grid-area: playlist; position: sticky; top: 74px; }
  .plist { max-height: calc(100vh - 260px); overflow: auto; margin: 0 -4px; }
  @media (max-width: 1020px) {
    .player-layout { grid-template: "video" "playlist" "tools" / minmax(0, 1fr); }
    .side-panel { position: static; }
    .plist { max-height: 55vh; }
  }
  @media (max-width: 600px) {
    .now { flex-wrap: wrap; }
    .now-actions { flex-basis: 100%; }
  }
  .pitem { display: flex; gap: 9px; align-items: center; padding: 7px 8px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
  .pitem:hover { background: #131d2e; }
  .pitem.on { background: #0d2a3f; border-color: var(--acc); }
  .pitem img { width: 74px; height: 44px; object-fit: cover; border-radius: 6px; background: var(--panel); flex: none; }
  .pitem .nm { font-size: 13px; font-weight: 600; line-height: 1.25; }
  .pitem .mt { color: var(--mut); font-size: 11.5px; }
  .pitem .prog { height: 3px; border-radius: 2px; background: #26344c; margin-top: 4px; overflow: hidden; }
  .pitem .prog i { display: block; height: 100%; background: var(--acc); }
  .pitem .dl {
    flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
    color: var(--mut2); text-decoration: none; border: 1px solid transparent; font-size: 14px;
  }
  .pitem .dl:hover { color: var(--acc); border-color: var(--border2); background: #131d2e; text-decoration: none; }
  .pitem .dl[aria-disabled="true"] { opacity: .3; pointer-events: none; }
  .pl-head { display: flex; gap: 8px; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); }
  .pl-head input[type=search] { width: 100%; }
  .filt { display: flex; gap: 6px; flex-wrap: wrap; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  .yt-frame { width: 100%; aspect-ratio: 16/9; border: 0; background: #000; }
  .kbd { border: 1px solid var(--border2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: 11px; font-family: ui-monospace, monospace; }
</style>
<noscript><style>#player-startup { display: none; }</style></noscript>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="/player"><img class="logo" src="/static/brand/web-player.svg" alt="" width="30" height="30"><span>web-player<small id="who">signed in</small></span></a>
      <span class="spacer"></span>
      <form method="post" action="/player/logout" style="display:inline">
        <button class="btn sm ghost" type="submit">sign out</button>
      </form>
    </div>
  </header>

  <main class="page">
    <section class="player-startup" id="player-startup" aria-labelledby="startup-title">
      <div class="card center">
        <div class="player-spinner" id="startup-spinner" aria-hidden="true"></div>
        <h1 id="startup-title">Loading your player…</h1>
        <p class="mut" id="startup-status" role="status">Getting your playlist ready.</p>
        <a class="btn pri hidden" id="startup-retry" href="/player">Try again</a>
      </div>
    </section>
    <noscript><p class="card center">Enable JavaScript and reload this page to use the player.</p></noscript>

    <div class="player-layout" id="player-content" hidden>
      <div class="video-frame">
        <div class="video-idle mut center" id="player-idle">
          <button class="btn pri hidden" id="btn-play-selected" type="button"><span aria-hidden="true">▶</span> Play</button>
          <span id="player-empty">No titles to play.</span>
        </div>
        <video id="v" class="video-js vjs-big-play-centered vjs-fluid hidden" controls preload="none" playsinline></video>
        <iframe id="yt" class="yt-frame hidden" title="YouTube player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>

      <aside class="side-panel" aria-label="Playlist">
        <div class="card" style="padding:0;overflow:hidden">
          <div class="pl-head">
            <input type="search" id="p-search" placeholder="Search the playlist…" aria-label="Search the playlist">
          </div>
          <div class="filt" id="p-filters"></div>
          <div class="plist" id="p-list"></div>
          <div class="pl-head" style="border-top:1px solid var(--border);border-bottom:0">
            <span class="mut small" id="p-count"></span>
          </div>
        </div>
      </aside>

      <div class="player-tools">
        <div class="now">
          <img id="now-poster" alt="" hidden>
          <div class="grow">
            <h2 id="now-title">Nothing playing</h2>
            <div class="mut small" id="now-meta"></div>
          </div>
          <div class="row now-actions">
            <button class="btn sm" id="btn-prev" type="button">⏮ prev</button>
            <button class="btn sm" id="btn-next" type="button">next ⏭</button>
            <a class="btn sm mut" id="btn-download" aria-disabled="true" title="Choose a title to download it">⬇ download</a>
          </div>
        </div>

        <div class="jump">
          <span class="mut small">Jump to</span>
          <input type="text" id="jump-in" placeholder="01:23:45" aria-label="Jump to timestamp">
          <button class="btn sm" id="btn-jump" type="button">Go</button>
          <span class="sep"></span>
          <button class="btn sm" id="btn-back" type="button">−10 s</button>
          <button class="btn sm" id="btn-fwd" type="button">+10 s</button>
          <span class="sep"></span>
          <label class="row mut small" style="gap:6px"><input type="checkbox" id="opt-resume" checked> resume where I left off</label>
          <label class="row mut small" style="gap:6px"><input type="checkbox" id="opt-next" autocomplete="off"> auto-play next</label>
        </div>

        <div class="card" style="margin-top:14px">
          <div class="card-head"><h3>Keyboard</h3></div>
          <div class="mut small" style="line-height:2">
            <span class="kbd">space</span> play/pause ·
            <span class="kbd">←</span> <span class="kbd">→</span> 10 s ·
            <span class="kbd">j</span> <span class="kbd">l</span> 30 s ·
            <span class="kbd">↑</span> <span class="kbd">↓</span> volume ·
            <span class="kbd">f</span> fullscreen ·
            <span class="kbd">m</span> mute ·
            <span class="kbd">/</span> focus the search box ·
            <span class="kbd">n</span> <span class="kbd">p</span> next / previous title
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toasts"></div>
</body>
</html>
