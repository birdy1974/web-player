<?xml version="1.0" encoding="UTF-8"?>
<!-- web-player — the icon in the tab of the browser.
     The same symbol as in the header, but simpler: at 16 pixels only the
     triangle survives, so the progress bar would only be noise. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="web-player">
  <title>web-player</title>
  <defs>
    <linearGradient id="wp-fav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#wp-fav)"/>
  <path d="M24 17 L44 32 L24 47 Z" fill="#06121f" stroke="#06121f"
        stroke-width="5" stroke-linejoin="round"/>
</svg>
