# web-player — CI
#
# Two jobs on every push and every pull request:
#
#   tests — the end-to-end API test and the mock-up smoke test;
#   image — the real Docker image is built (the check that cannot be done on
#           a machine without Docker) and, on `main`, published to GitHub
#           Container Registry as ghcr.io/birdy1974/web-player:latest.
#
# The registry step only runs for a push to `main` of this repository, so a
# pull request from a fork can never publish anything.
#
# The DS918+ has an Intel Celeron J3455: x86-64, so the image is built for
# linux/amd64. An ARM NAS needs linux/arm64 as well — add it to `platforms`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    env:
      TEST_FFMPEG_RELEASE: b6.1.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The tests need real FFmpeg tools, not the system package and its
      # dependencies. Keep the full FFmpeg install in the runtime Docker image.
      - name: Cache test FFmpeg downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/web-player-ffmpeg/downloads
          key: test-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ env.TEST_FFMPEG_RELEASE }}

      - name: Set up FFmpeg and ffprobe for tests
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/web-player-ffmpeg"
          release_url="https://github.com/eugeneware/ffmpeg-static/releases/download/$TEST_FFMPEG_RELEASE"
          mkdir -p "$install_dir/downloads" "$install_dir/bin"
          cd "$install_dir/downloads"

          install_tool() {
            local name="$1" digest="$2"
            local asset="$name-linux-x64.gz"
            if [[ -f "$asset" ]] && printf '%s  %s\n' "$digest" "$asset" | sha256sum --check --status; then
              echo "Using cached $name"
            else
              curl --fail --silent --show-error --location --connect-timeout 10 \
                --max-time 60 --retry 2 --retry-max-time 90 --output "$asset" "$release_url/$asset"
              printf '%s  %s\n' "$digest" "$asset" | sha256sum --check --strict
            fi
            gzip -dc "$asset" > "$install_dir/bin/$name"
            chmod +x "$install_dir/bin/$name"
            "$install_dir/bin/$name" -version
          }

          # SHA-256 digests of the compressed assets in the pinned release.
          install_tool ffmpeg bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa
          install_tool ffprobe 25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067
          printf '%s\n' "$install_dir/bin" >> "$GITHUB_PATH"

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: the mock-up smoke test
        run: npm test

      - name: the end-to-end test
        run: python tools/test_app.py

  image:
    name: docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: log in to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=web-player
            org.opencontainers.image.description=Management console and public web player for a Synology NAS
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image has to work, not only build. These two steps run it.
      - name: the VAAPI driver is in the image
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:latest sh -c \
            "ls -1 /usr/lib/x86_64-linux-gnu/dri/ | grep -E 'iHD_drv_video\.so|i965_drv_video\.so'"

      - name: the container starts and answers
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker run -d --name web-player-ci -p 18088:8088 \
            -e WEB_PLAYER_ADMIN_PASSWORD=ci-secret \
            -v web-player-ci-config:/config ghcr.io/${{ github.repository }}:latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18088/api/health > /dev/null 2>&1; then
              echo "the container is healthy"
              curl -fsS http://127.0.0.1:18088/api/health
              docker logs web-player-ci | tail -20
              docker rm -f web-player-ci
              exit 0
            fi
            sleep 2
          done
          echo "the container did not become healthy:"
          docker logs web-player-ci | tail -40
          docker rm -f web-player-ci
          exit 1
